    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // Audio Synthesis Manager (Web Audio API)
      let audioCtx = null;
      let isMutedSetting = false;

      function getAudioContext() {
        if (isMutedSetting) return null;
        if (!audioCtx) {
          try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          } catch (e) {
            console.warn("Web Audio API not supported", e);
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      const sounds = {
        playClick: () => {
          const ctx = getAudioContext();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gainNode = ctx.createGain();
          osc.connect(gainNode);
          gainNode.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, ctx.currentTime);
          gainNode.gain.setValueAtTime(0.04, ctx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.03);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.04);
        },
        playDraw: () => {
          const ctx = getAudioContext();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gainNode = ctx.createGain();
          const filter = ctx.createBiquadFilter();
          osc.connect(filter);
          filter.connect(gainNode);
          gainNode.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(160, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.15);
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(1000, ctx.currentTime);
          filter.frequency.exponentialRampToValueAtTime(220, ctx.currentTime + 0.15);
          gainNode.gain.setValueAtTime(0, ctx.currentTime);
          gainNode.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 0.03);
          gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.16);
        },
        playTilePlace: () => {
          const ctx = getAudioContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.type = 'triangle';
          osc1.frequency.setValueAtTime(1200, now);
          osc1.frequency.exponentialRampToValueAtTime(800, now + 0.03);
          gain1.gain.setValueAtTime(0.2, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc1.connect(gain1);
          gain1.connect(ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.05);

          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(190, now);
          osc2.frequency.exponentialRampToValueAtTime(130, now + 0.07);
          gain2.gain.setValueAtTime(0.3, now);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start(now);
          osc2.stop(now + 0.09);
        },
        playShuffle: () => {
          const ctx = getAudioContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          for (let i = 0; i < 7; i++) {
            const delay = i * 0.09 + Math.random() * 0.04;
            setTimeout(() => {
              const liveCtx = getAudioContext();
              if (!liveCtx || isMutedSetting) return;
              const tileNow = liveCtx.currentTime;
              const osc = liveCtx.createOscillator();
              const gain = liveCtx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(550 + Math.random() * 400, tileNow);
              gain.gain.setValueAtTime(0.08, tileNow);
              gain.gain.exponentialRampToValueAtTime(0.001, tileNow + 0.04);
              osc.connect(gain);
              gain.connect(liveCtx.destination);
              osc.start(tileNow);
              osc.stop(tileNow + 0.05);
            }, delay * 1000);
          }
        },
        playSuccess: () => {
          const ctx = getAudioContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          const notes = [261.63, 329.63, 392.00, 523.25];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gainNode = ctx.createGain();
            osc.connect(gainNode);
            gainNode.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gainNode.gain.setValueAtTime(0, now + idx * 0.08);
            gainNode.gain.linearRampToValueAtTime(0.12, now + idx * 0.08 + 0.04);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.35);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.45);
          });
        },
        playFail: () => {
          const ctx = getAudioContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          const notes = [311.13, 293.66, 220.00, 146.83];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gainNode = ctx.createGain();
            osc.connect(gainNode);
            gainNode.connect(ctx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, now + idx * 0.12);
            gainNode.gain.setValueAtTime(0, now + idx * 0.12);
            gainNode.gain.linearRampToValueAtTime(0.08, now + idx * 0.12 + 0.04);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.5);
            osc.start(now + idx * 0.12);
            osc.stop(now + idx * 0.12 + 0.6);
          });
        }
      };

      // Inline Vectors representing SVG icons

        ),

        ),
        Sparkles: () => (
          <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9.813 15.904L9 21l-.813-5.096L3 15l5.096-.813L9 9l.813 5.096L15 15l-5.188.904zM19.051 7.14L18.5 10.5l-.551-3.36L14.5 6.5l3.36-.551L18.5 2.5l.551 3.36L22.5 6.5l-3.449.64z"/></svg>
        ),
        Play: () => (
          <svg className="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5.14v14l11-7-11-7z"/></svg>
        ),
        ArrowRightLeft: () => (
          <svg className="w-3 h-3" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M7.5 21L3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5"/></svg>
        ),
        Check: () => (
          <svg className="w-3 h-3" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
        ),
        AlertCircle: () => (
          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/></svg>
        ),
        Plus: () => (
          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
        ),
        ArrowRight: () => (
          <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/></svg>
        )
      };

      const OPPONENTS = [
        { name: "Carlos", country: "Brésil", flag: "🇧🇷", desc: "Danseur de samba au jeu très tactique 🕺" },
        { name: "Yuki", country: "Japon", flag: "🇯🇵", desc: "Maître zen d'une précision redoutable 🥋" },
        { name: "Sarah", country: "États-Unis", flag: "🇺🇸", desc: "As du bluff et des décisions éclair 🤠" },
        { name: "Pierre", country: "France", flag: "🇫🇷", desc: "Fin de la stratégie et de la logique pure 🥐" },
        { name: "Lorenzo", country: "Italie", flag: "🇮🇹", desc: "Joueur créatif plein de passion italienne 🍝" },
        { name: "Fatou", country: "Sénégal", flag: "🇸🇳", desc: "Reine insaisissable des blocages d'arène 🦁" },
      ];

      const generateDeck = () => {
        const deck = [];
        for (let i = 0; i <= 6; i++) {
          for (let j = i; j <= 6; j++) {
            deck.push({
              id: `domino-${i}-${j}`,
              value: [i, j],
              isDouble: i === j,
            });
          }
        }
        return deck;
      };

      const shuffleDeck = (deck) => {
        const newDeck = [...deck];
        for (let i = newDeck.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const temp = newDeck[i];
          newDeck[i] = newDeck[j];
          newDeck[j] = temp;
        }
        return newDeck;
      };

      const determineStarter = (playerHand, computerHand) => {
        for (let d = 6; d >= 0; d--) {
          const pDouble = playerHand.find(x => x.value[0] === d && x.value[1] === d);
          if (pDouble) return { turn: 'player', domino: pDouble };

          const cDouble = computerHand.find(x => x.value[0] === d && x.value[1] === d);
          if (cDouble) return { turn: 'computer', domino: cDouble };
        }

        let bestPlayerDom = playerHand[0];
        let bestPlayerSum = -1;
        playerHand.forEach(d => {
          const sum = d.value[0] + d.value[1];
          if (sum > bestPlayerSum) {
            bestPlayerSum = sum;
            bestPlayerDom = d;
          }
        });

        let bestComputerDom = computerHand[0];
        let bestComputerSum = -1;
        computerHand.forEach(d => {
          const sum = d.value[0] + d.value[1];
          if (sum > bestComputerSum) {
            bestComputerSum = sum;
            bestComputerDom = d;
          }
        });

        if (bestPlayerSum >= bestComputerSum) {
          return { turn: 'player', domino: bestPlayerDom };
        } else {
          return { turn: 'computer', domino: bestComputerDom };
        }
      };

      const calculateHandScore = (hand) => {
        return hand.reduce((total, d) => total + d.value[0] + d.value[1], 0);
      };

      function Dot({ active, size }) {
        const sizeClasses = {
          hand: 'w-2 h-2 sm:w-2.5 sm:h-2.5',
          board: 'w-1.5 h-1.5 sm:w-2 sm:h-2',
          compact: 'w-1 h-1 sm:w-1.5 sm:h-1.5',
        };
        const currentClass = sizeClasses[size] || sizeClasses.hand;
        return (
          <div className="flex items-center justify-center w-full h-full">
            {active && (
              <div className={`${currentClass} rounded-full bg-slate-950 transition-all duration-300 shadow-sm`} />
            )}
          </div>
        );
      }

      function HalfDots({ value, size }) {
        const getActiveIndices = (val) => {
          switch (val) {
            case 0: return [];
            case 1: return [4];
            case 2: return [0, 8];
            case 3: return [0, 4, 8];
            case 4: return [0, 2, 6, 8];
            case 5: return [0, 2, 4, 6, 8];
            case 6: return [0, 2, 3, 5, 6, 8];
            default: return [];
          }
        };

        const activeIndices = getActiveIndices(value);

        return (
          <div className="grid grid-cols-3 grid-rows-3 gap-[1px] w-full h-full p-1.5 sm:p-2 aspect-square">
            {Array.from({ length: 9 }).map((_, i) => (
              <Dot key={i} active={activeIndices.includes(i)} size={size} />
            ))}
          </div>
        );
      }

      function DominoTile({
        domino,
        orientation = 'vertical',
        isFaceDown = false,
        isPlayable = false,
        isSelected = false,
        isGhost = false,
        size = 'hand',
        onClick,
        draggable = false,
        onDragStart,
      }) {
        const isVertical = orientation === 'vertical';

        const sizeStyles = {
          hand: {
            v: 'w-14 h-28 sm:w-16 sm:h-32 text-lg',
            h: 'w-28 h-14 sm:w-32 sm:h-16 text-lg',
          },
          board: {
            v: 'w-10 h-20 sm:w-12 sm:h-24 text-sm',
            h: 'w-20 h-10 sm:w-24 sm:h-12 text-sm',
          },
          compact: {
            v: 'w-8 h-16 sm:w-10 sm:h-20 text-xs',
            h: 'w-16 h-8 sm:w-20 sm:h-10 text-xs',
          },
        };

        const currentSizeClass = sizeStyles[size][isVertical ? 'v' : 'h'];

        const handleDragStartInternal = (e) => {
          if (draggable && onDragStart) {
            onDragStart(e);
          } else {
            e.preventDefault();
          }
        };

        if (isGhost) {
          return (
            <div
              onClick={onClick}
              className={`${currentSizeClass} border-2 border-dashed border-emerald-400/80 bg-emerald-400/10 hover:bg-emerald-400/25 cursor-pointer rounded-2xl flex items-center justify-center animate-pulse transition-all duration-200 shadow-md`}
            >
              <span className="text-emerald-400 text-2xl font-bold font-mono">+</span>
            </div>
          );
        }

        if (isFaceDown) {
          return (
            <div className={`${currentSizeClass} shrink-0 bg-slate-100 rounded-2xl border-4 border-slate-900 shadow-[2px_4px_8px_rgba(0,0,0,0.35)] relative select-none transform transition-all duration-300 p-[3px]`}>
              <div className="w-full h-full bg-gradient-to-br from-teal-800 via-teal-950 to-slate-950 rounded-xl relative overflow-hidden flex items-center justify-center border border-teal-500/20">
                <div className="absolute inset-0 opacity-15 bg-[repeating-linear-gradient(45deg,#2dd4bf_0px,#2dd4bf_4px,transparent_4px,transparent_12px)]" />
                <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(45,212,191,0.15)_0%,transparent_85%)]" />
                <div className="w-6 h-6 sm:w-8 sm:h-8 border-2 border-teal-400/40 rounded-xl flex items-center justify-center rotate-45 bg-[#042f2e] shadow-inner font-bold">
                  <div className="w-2 h-2 sm:w-2.5 sm:h-2.5 bg-teal-400 rounded-full animate-pulse shadow-[0_0_8px_#2dd4bf]" />
                </div>
              </div>
            </div>
          );
        }

        const [val1, val2] = domino.value;

        return (
          <div
            onClick={onClick}
            draggable={draggable}
            onDragStart={handleDragStartInternal}
            className={`
              ${currentSizeClass}
              shrink-0
              bg-[#fefefe]
              rounded-2xl
              border-4
              border-slate-900
              relative
              flex
              ${isVertical ? 'flex-col' : 'flex-row'}
              items-center
              justify-between
              cursor-pointer
              select-none
              transform
              hover:-translate-y-2
              hover:scale-105
              active:translate-y-0
              active:scale-95
              transition-all
              duration-300
              shadow-[4px_6px_0px_#021211]
              ${isPlayable ? 'ring-4 ring-[#2dd4bf] playable-tile-glow' : ''}
              ${isSelected ? 'ring-4 ring-amber-400 -translate-y-2 scale-105 shadow-[6px_10px_0px_#021211]' : ''}
            `}
            style={{ touchAction: 'none' }}
          >
            <div className="w-full h-full max-w-full max-h-full flex items-center justify-center overflow-hidden">
              <HalfDots value={val1} size={size} />
            </div>

            <div className={`bg-slate-300 shrink-0 relative flex items-center justify-center ${isVertical ? 'w-[85%] h-[2px] mx-auto' : 'h-[85%] w-[2px] my-auto'}`}>
              <div className="absolute w-2 h-2 rounded-full bg-amber-600 border border-amber-400 shadow-[inset_0_1px_1px_rgba(255,255,255,0.4),0_1px_2px_rgba(0,0,0,0.5)] z-10" />
            </div>

            <div className="w-full h-full max-w-full max-h-full flex items-center justify-center overflow-hidden">
              <HalfDots value={val2} size={size} />
            </div>
          </div>
        );
      }

      function App() {
        const [board, setBoard] = useState([]);
        const [playerHand, setPlayerHand] = useState([]);
        const [computerHand, setComputerHand] = useState([]);
        const [boneyard, setBoneyard] = useState([]);
        const [turn, setTurn] = useState('player');
        const [victory, setVictory] = useState(null);
        const [selectedDominoId, setSelectedDominoId] = useState(null);
        const [starterDomino, setStarterDomino] = useState(null);
        const [logs, setLogs] = useState([]);
        const [aiThinking, setAiThinking] = useState(false);
        const [aiStatus, setAiStatus] = useState('');
        const [mutedState, setMutedState] = useState(false);
        const [showRules, setShowRules] = useState(false);
        const [isDraggedOverLeft, setIsDraggedOverLeft] = useState(false);
        const [isDraggedOverRight, setIsDraggedOverRight] = useState(false);

        // Tournament States
        const [opponentIndex, setOpponentIndex] = useState(0);
        const [tournamentPlayerScore, setTournamentPlayerScore] = useState(0);
        const [tournamentComputerScore, setTournamentComputerScore] = useState(0);
        const [roundNumber, setRoundNumber] = useState(1);
        const [showRoundPopup, setShowRoundPopup] = useState(false);
        const [roundWinner, setRoundWinner] = useState(null);
        const [roundGainedPoints, setRoundGainedPoints] = useState(0);
        const [showTournamentEndPopup, setShowTournamentEndPopup] = useState(false);
        const [tournamentWinner, setTournamentWinner] = useState(null);

        const boardScrollRef = useRef(null);
        const logsEndRef = useRef(null);

        const currentOpponent = OPPONENTS[opponentIndex] || OPPONENTS[0];

        const toggleMuted = () => {
          isMutedSetting = !isMutedSetting;
          setMutedState(isMutedSetting);
          sounds.playClick();
        };

        const addLog = (text, type) => {
          const timeStr = new Date().toLocaleTimeString('fr-FR', {
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
          });
          setLogs(prev => [
            ...prev,
            {
              id: `log-${Date.now()}-${Math.random()}`,
              text,
              type,
              timestamp: timeStr,
            },
          ]);
        };

        useEffect(() => {
          logsEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        }, [logs]);

        const initGame = (oppIdx = opponentIndex, isNewMatch = false) => {
          sounds.playShuffle();
          const freshDeck = generateDeck();
          const shuffled = shuffleDeck(freshDeck);

          const player = shuffled.slice(0, 7);
          const computer = shuffled.slice(7, 14);
          const boneyardRemaining = shuffled.slice(14);

          const starterInfo = determineStarter(player, computer);

          setBoard([]);
          setPlayerHand(player);
          setComputerHand(computer);
          setBoneyard(boneyardRemaining);
          setTurn(starterInfo.turn);
          setStarterDomino(starterInfo.domino);
          setVictory(null);
          setSelectedDominoId(null);
          setAiThinking(false);
          setAiStatus('');

          setLogs([]);
          const opp = OPPONENTS[oppIdx] || OPPONENTS[0];
          const starterStr = `[${starterInfo.domino.value[0]}|${starterInfo.domino.value[1]}]`;
          addLog(`Round ${isNewMatch ? 1 : roundNumber} lancé contre ${opp.flag} ${opp.name} ! Chaque joueur reçoit 7 dominos.`, 'system');
          if (starterInfo.turn === 'player') {
            addLog(`Vous commencez ! Placez votre domino le plus fort : ${starterStr}`, 'player');
          } else {
            addLog(`${opp.name} commence car elle possède le domino le plus fort : ${starterStr}`, 'computer');
          }
        };

        const startNewMatch = (index = opponentIndex) => {
          setOpponentIndex(index);
          setTournamentPlayerScore(0);
          setTournamentComputerScore(0);
          setRoundNumber(1);
          setShowRoundPopup(false);
          setRoundWinner(null);
          setRoundGainedPoints(0);
          setShowTournamentEndPopup(false);
          setTournamentWinner(null);
          initGame(index, true);
        };

        const handleRoundContinue = () => {
          sounds.playClick();

          const playerReached100 = tournamentPlayerScore >= 100;
          const computerReached100 = tournamentComputerScore >= 100;
          const roundsMaxReached = roundNumber >= 12;

          if (playerReached100 || computerReached100 || roundsMaxReached) {
            let winner = 'player';
            if (playerReached100 && !computerReached100) {
              winner = 'player';
            } else if (computerReached100 && !playerReached100) {
              winner = 'computer';
            } else {
              winner = tournamentPlayerScore >= tournamentComputerScore ? 'player' : 'computer';
            }

            setTournamentWinner(winner);
            setShowRoundPopup(false);
            setShowTournamentEndPopup(true);
            if (winner === 'player') {
              sounds.playSuccess();
            } else {
              sounds.playFail();
            }
          } else {
            setRoundNumber(prev => prev + 1);
            setShowRoundPopup(false);
            initGame(opponentIndex);
          }
        };

        const handleNextOpponent = () => {
          sounds.playClick();
          const nextIdx = (opponentIndex + 1) % OPPONENTS.length;
          startNewMatch(nextIdx);
        };

        const handleRetryOpponent = () => {
          sounds.playClick();
          startNewMatch(opponentIndex);
        };

        useEffect(() => {
          startNewMatch(0);
        }, []);

        const getBoardEnds = () => {
          if (board.length === 0) return null;
          const left = board[0].arrangedValue[0];
          const right = board[board.length - 1].arrangedValue[1];
          return { left, right };
        };

        const checkIsPlayable = (domino) => {
          if (board.length === 0) {
            const isStarter = starterDomino && domino.id === starterDomino.id;
            return {
              left: !!isStarter,
              right: !!isStarter,
              any: !!isStarter,
            };
          }

          const ends = getBoardEnds();
          if (!ends) return { left: false, right: false, any: false };

          const [a, b] = domino.value;
          const leftPlayable = a === ends.left || b === ends.left;
          const rightPlayable = a === ends.right || b === ends.right;

          return {
            left: leftPlayable,
            right: rightPlayable,
            any: leftPlayable || rightPlayable,
          };
        };

        const playerHasAnyPlay = () => playerHand.some(d => checkIsPlayable(d).any);
        const computerHasAnyPlay = () => computerHand.some(d => checkIsPlayable(d).any);

        const scrollBoard = (side) => {
          setTimeout(() => {
            if (boardScrollRef.current) {
              const boardElem = boardScrollRef.current;
              if (side === 'left') {
                boardElem.scrollTo({ left: 0, behavior: 'smooth' });
              } else {
                boardElem.scrollTo({ left: boardElem.scrollWidth, behavior: 'smooth' });
              }
            }
          }, 150);
        };

        const handlePlaceDomino = (dominoId, side) => {
          const isPlayer = turn === 'player';
          const hand = isPlayer ? playerHand : computerHand;
          const domino = hand.find(d => d.id === dominoId);

          if (!domino) return;

          if (board.length === 0) {
            if (starterDomino && domino.id !== starterDomino.id) {
              addLog(`Erreur: Vous devez commencer par poser votre domino obligatoire: [${starterDomino.value[0]}|${starterDomino.value[1]}]`, 'system');
              return;
            }

            const newPlaced = {
              ...domino,
              arrangedValue: [...domino.value],
              position: 'first',
            };

            setBoard([newPlaced]);
            if (isPlayer) {
              setPlayerHand(prev => prev.filter(d => d.id !== dominoId));
            } else {
              setComputerHand(prev => prev.filter(d => d.id !== dominoId));
            }

            sounds.playTilePlace();
            addLog(
              `${isPlayer ? 'Vous avez' : "L'IA a"} ouvert l'arène de jeu avec le domino [${domino.value[0]}|${domino.value[1]}]`,
              isPlayer ? 'player' : 'computer'
            );

            setSelectedDominoId(null);
            afterTurnExecuted(isPlayer ? 'computer' : 'player', [newPlaced], isPlayer, dominoId);
            return;
          }

          const { left: leftEnd, right: rightEnd } = getBoardEnds();
          const [a, b] = domino.value;
          let arranged = null;

          if (side === 'left') {
            if (b === leftEnd) {
              arranged = [a, b];
            } else if (a === leftEnd) {
              arranged = [b, a];
            }
          } else {
            if (a === rightEnd) {
              arranged = [a, b];
            } else if (b === rightEnd) {
              arranged = [b, a];
            }
          }

          if (!arranged) return;

          const newPlaced = {
            ...domino,
            arrangedValue: arranged,
            position: side,
          };

          const nextBoard = side === 'left' ? [newPlaced, ...board] : [...board, newPlaced];

          setBoard(nextBoard);

          if (isPlayer) {
            setPlayerHand(prev => prev.filter(d => d.id !== dominoId));
          } else {
            setComputerHand(prev => prev.filter(d => d.id !== dominoId));
          }

          sounds.playTilePlace();
          addLog(
            `${isPlayer ? 'Vous avez' : "L'IA a"} posé le domino [${domino.value[0]}|${domino.value[1]}] à ${side === 'left' ? 'gauche' : 'droite'}`,
            isPlayer ? 'player' : 'computer'
          );

          setSelectedDominoId(null);
          scrollBoard(side);
          afterTurnExecuted(isPlayer ? 'computer' : 'player', nextBoard, isPlayer, dominoId);
        };

        const afterTurnExecuted = (
          nextTurn,
          currentBoard,
          justPlayedByPlayer,
          playedDominoId,
          wasPass = false
        ) => {
          const dId = wasPass ? null : (playedDominoId || selectedDominoId);
          const currentHands = {
            player: justPlayedByPlayer && dId ? playerHand.filter(d => d.id !== dId) : playerHand,
            computer: !justPlayedByPlayer && dId ? computerHand.filter(d => d.id !== dId) : computerHand,
          };

          if (justPlayedByPlayer && currentHands.player.length === 0) {
            const points = calculateHandScore(currentHands.computer);
            setTournamentPlayerScore(prev => prev + points);
            setRoundGainedPoints(points);
            setRoundWinner('player');
            setVictory('player');
            sounds.playSuccess();
            addLog(`🎉 Félicitations, vous avez vidé votre main ! Vous marquez +${points} pts contre ${currentOpponent.name} !`, 'player');
            setShowRoundPopup(true);
            return;
          }
          if (!justPlayedByPlayer && currentHands.computer.length === 0) {
            const points = calculateHandScore(currentHands.player);
            setTournamentComputerScore(prev => prev + points);
            setRoundGainedPoints(points);
            setRoundWinner('computer');
            setVictory('computer');
            sounds.playFail();
            addLog(`😢 ${currentOpponent.name} a vidé sa main et marque +${points} pts !`, 'computer');
            setShowRoundPopup(true);
            return;
          }

          const testPlayerPlayable = currentHands.player.some(d => {
            if (currentBoard.length === 0 || !currentBoard[0] || !currentBoard[currentBoard.length - 1]) return true;
            const left = currentBoard[0].arrangedValue[0];
            const right = currentBoard[currentBoard.length - 1].arrangedValue[1];
            const [a, b] = d.value;
            return a === left || b === left || a === right || b === right;
          });

          const testComputerPlayable = currentHands.computer.some(d => {
            if (currentBoard.length === 0 || !currentBoard[0] || !currentBoard[currentBoard.length - 1]) return true;
            const left = currentBoard[0].arrangedValue[0];
            const right = currentBoard[currentBoard.length - 1].arrangedValue[1];
            const [a, b] = d.value;
            return a === left || b === left || a === right || b === right;
          });

          const isBoneyardEmpty = boneyard.length === 0;

          if (!testPlayerPlayable && !testComputerPlayable && isBoneyardEmpty) {
            const playerRestPoints = calculateHandScore(currentHands.player);
            const computerRestPoints = calculateHandScore(currentHands.computer);

            addLog(`Le jeu est complètement Bloqué ! Pioche vide et plus aucun coup possible.`, 'system');
            addLog(`Calcul des scores finaux du round :`, 'system');
            addLog(`- Vos points : ${playerRestPoints} pts`, 'player');
            addLog(`- Points de ${currentOpponent.name} : ${computerRestPoints} pts`, 'computer');

            if (playerRestPoints < computerRestPoints) {
              const points = computerRestPoints;
              setTournamentPlayerScore(prev => prev + points);
              setRoundGainedPoints(points);
              setRoundWinner('player');
              setVictory('player');
              sounds.playSuccess();
              addLog(`🏆 Gagné ! Vous avez moins de points (${playerRestPoints} vs ${computerRestPoints}). Vous marquez +${points} pts !`, 'player');
            } else if (computerRestPoints < playerRestPoints) {
              const points = playerRestPoints;
              setTournamentComputerScore(prev => prev + points);
              setRoundGainedPoints(points);
              setRoundWinner('computer');
              setVictory('computer');
              sounds.playFail();
              addLog(`💻 Perdu ! ${currentOpponent.name} remporte la manche car elle a moins de points (${computerRestPoints} vs ${playerRestPoints}). Elle marque +${points} pts !`, 'computer');
            } else {
              setRoundGainedPoints(0);
              setRoundWinner('draw');
              setVictory('draw');
              sounds.playSuccess();
              addLog(`🤝 Égalité parfaite ! Les deux joueurs ont exactement ${playerRestPoints} points restants. Aucun point marqué.`, 'system');
            }
            setShowRoundPopup(true);
            return;
          }

          setTurn(nextTurn);
        };

        const handlePlayerDraw = () => {
          if (turn !== 'player' || victory || aiThinking) return;

          if (playerHasAnyPlay()) {
            addLog(`Impossible de piocher : vous avez des dominos jouables !`, 'system');
            return;
          }

          if (boneyard.length === 0) {
            addLog(`La pioche est vide ! Passez votre tour.`, 'system');
            return;
          }

          sounds.playDraw();
          const drawn = boneyard[0];
          const newBoneyard = boneyard.slice(1);
          const newHand = [...playerHand, drawn];

          setBoneyard(newBoneyard);
          setPlayerHand(newHand);

          addLog(`Vous avez pioché le domino [${drawn.value[0]}|${drawn.value[1]}]`, 'player');

          const playStatus = checkIsPlayable(drawn);
          if (playStatus.any) {
            setSelectedDominoId(drawn.id);
          }
        };

        const handlePlayerPass = () => {
          if (turn !== 'player' || victory || aiThinking) return;

          if (playerHasAnyPlay()) {
            addLog(`Sélectionnez un domino pour jouer : vous avez des coups possibles !`, 'system');
            return;
          }

          if (boneyard.length > 0) {
            addLog(`Vous ne pouvez pas passer : des dominos sont encore disponibles dans la pioche !`, 'system');
            return;
          }

          addLog(`Vous passez votre tour.`, 'player');
          afterTurnExecuted('computer', board, true, undefined, true);
        };

        // Computer AI Logic hook
        useEffect(() => {
          if (turn !== 'computer' || victory || aiThinking) return;

          let isSubscribed = true;

          const executeAiStep = async () => {
            setAiThinking(true);
            setAiStatus(`${currentOpponent.name} examine son jeu...`);

            await new Promise(resolve => setTimeout(resolve, 1400));
            if (!isSubscribed) return;

            if (board.length === 0) {
              if (starterDomino) {
                setAiStatus(`${currentOpponent.name} pose le domino de départ...`);
                await new Promise(resolve => setTimeout(resolve, 800));
                if (!isSubscribed) return;

                const starterPlaced = {
                  ...starterDomino,
                  arrangedValue: [...starterDomino.value],
                  position: 'first',
                };

                setBoard([starterPlaced]);
                setComputerHand(prev => prev.filter(d => d.id !== starterDomino.id));
                sounds.playTilePlace();
                addLog(
                  `${currentOpponent.name} entame l'arène avec le domino de départ [${starterDomino.value[0]}|${starterDomino.value[1]}]`,
                  'computer'
                );

                setAiThinking(false);
                setAiStatus('');
                afterTurnExecuted('player', [starterPlaced], false, starterDomino.id);
              }
              return;
            }

            const playableOptions = computerHand.filter(d => checkIsPlayable(d).any);

            if (playableOptions.length > 0) {
              playableOptions.sort((x, y) => {
                if (x.isDouble && !y.isDouble) return -1;
                if (!x.isDouble && y.isDouble) return 1;
                const sumX = x.value[0] + x.value[1];
                const sumY = y.value[0] + y.value[1];
                return sumY - sumX;
              });

              const selected = playableOptions[0];
              const limits = checkIsPlayable(selected);

              let chosenSide = 'right';
              if (limits.left && limits.right) {
                chosenSide = Math.random() > 0.5 ? 'left' : 'right';
              } else if (limits.left) {
                chosenSide = 'left';
              }

              setAiStatus(`${currentOpponent.name} s'apprête à jouer...`);
              await new Promise(resolve => setTimeout(resolve, 600));
              if (!isSubscribed) return;

              const { left: leftEnd, right: rightEnd } = getBoardEnds();
              const [a, b] = selected.value;
              let arranged = [0, 0];

              if (chosenSide === 'left') {
                arranged = b === leftEnd ? [a, b] : [b, a];
              } else {
                arranged = a === rightEnd ? [a, b] : [b, a];
              }

              const newPlaced = {
                ...selected,
                arrangedValue: arranged,
                position: chosenSide,
              };

              const nextBoard = chosenSide === 'left' ? [newPlaced, ...board] : [...board, newPlaced];

              setBoard(nextBoard);
              setComputerHand(prev => prev.filter(d => d.id !== selected.id));
              sounds.playTilePlace();

              addLog(
                `${currentOpponent.name} a placé le domino [${selected.value[0]}|${selected.value[1]}] à ${chosenSide === 'left' ? 'gauche' : 'droite'}`,
                'computer'
              );

              setAiThinking(false);
              setAiStatus('');
              scrollBoard(chosenSide);

              afterTurnExecuted('player', nextBoard, false, selected.id);
            } else {
              if (boneyard.length > 0) {
                setAiStatus(`Pas de coup possible. ${currentOpponent.name} pioche...`);
                await new Promise(resolve => setTimeout(resolve, 1200));
                if (!isSubscribed) return;

                sounds.playDraw();
                const drawnTile = boneyard[0];
                setBoneyard(prev => prev.slice(1));
                setComputerHand(prev => [...prev, drawnTile]);

                addLog(`${currentOpponent.name} ne peut pas jouer et pioche un domino du talon.`, 'computer');

                setAiThinking(false);
                setAiStatus('');
              } else {
                setAiStatus(`Plus de dominos. ${currentOpponent.name} passe son tour.`);
                await new Promise(resolve => setTimeout(resolve, 1400));
                if (!isSubscribed) return;

                addLog(`${currentOpponent.name} a passé son tour car le talon est vide et aucun coup n'est possible.`, 'computer');
                setAiThinking(false);
                setAiStatus('');
                afterTurnExecuted('player', board, false, undefined, true);
              }
            }
          };

          executeAiStep();

          return () => {
            isSubscribed = false;
          };
        }, [turn, board.length, boneyard.length, victory]);

        const handleTileClick = (domino) => {
          if (turn !== 'player' || victory || aiThinking) return;

          sounds.playClick();

          if (board.length === 0 && starterDomino) {
            if (domino.id !== starterDomino.id) {
              addLog(
                `Action bloquée ! Vous devez débuter la partie en jouant votre double le plus élevé : [${starterDomino.value[0]}|${starterDomino.value[1]}]`,
                'system'
              );
              return;
            }
          }

          const { any: isPlayable } = checkIsPlayable(domino);

          if (!isPlayable) {
            addLog(
              `Ce domino [${domino.value[0]}|${domino.value[1]}] ne peut être placé sur aucun des cotés actifs du jeu !`,
              'system'
            );
            return;
          }

          if (selectedDominoId === domino.id) {
            setSelectedDominoId(null);
          } else {
            setSelectedDominoId(domino.id);

            const spec = checkIsPlayable(domino);
            if (board.length === 0) {
              handlePlaceDomino(domino.id, 'right');
            } else if (spec.left && !spec.right) {
              handlePlaceDomino(domino.id, 'left');
            } else if (spec.right && !spec.left) {
              handlePlaceDomino(domino.id, 'right');
            }
          }
        };

        const handleDragStart = (e, id) => {
          if (turn !== 'player' || victory || aiThinking) {
            e.preventDefault();
            return;
          }
          const domino = playerHand.find(d => d.id === id);
          if (!domino) return;

          const { any } = checkIsPlayable(domino);
          if (!any) {
            e.preventDefault();
            return;
          }

          setSelectedDominoId(id);
          e.dataTransfer.setData('text/plain', id);
        };

        const handleDrop = (e, side) => {
          e.preventDefault();
          setIsDraggedOverLeft(false);
          setIsDraggedOverRight(false);

          const matchId = e.dataTransfer.getData('text/plain') || selectedDominoId;
          if (matchId) {
            const domino = playerHand.find(d => d.id === matchId);
            if (domino) {
              const spec = checkIsPlayable(domino);
              if ((side === 'left' && spec.left) || (side === 'right' && spec.right)) {
                handlePlaceDomino(matchId, side);
              }
            }
          }
        };

        const getSelectedPlayableSpec = () => {
          if (!selectedDominoId) return { left: false, right: false };
          const selectedObj = playerHand.find(d => d.id === selectedDominoId);
          if (!selectedObj) return { left: false, right: false };
          return checkIsPlayable(selectedObj);
        };

        const selectedSpec = getSelectedPlayableSpec();

        return (
          <div className="min-h-screen immersive-bg text-slate-100 flex flex-col font-sans select-none overflow-x-hidden pb-6">
            <header className="immersive-header py-3.5 px-4 md:px-8 flex flex-wrap justify-between items-center gap-4 sticky top-0 z-20">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-[#2dd4bf] to-teal-700 border-2 border-slate-900 shadow-md flex items-center justify-center font-black text-slate-950 font-mono text-xl rotate-12">
                  ::
                </div>
                <div>
                  <h1 className="text-xl md:text-2xl font-black tracking-tight text-[#2dd4bf] drop-shadow flex items-center gap-2">
                    Droppex Dominoes <span className="text-xs bg-teal-950/60 text-teal-300 font-bold px-2 py-0.5 rounded-full border border-teal-400/20">Tournoi</span>
                  </h1>
                  <p className="text-xs text-teal-200/70 font-medium">Jeu intelligent de domino Double-Six</p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={toggleMuted}
                  className="p-2.5 rounded-xl bg-black/40 border-2 border-[#2dd4bf]/30 hover:bg-[#2dd4bf]/10 active:scale-95 transition-all text-slate-200"
                  title="Sons On/Off"
                >
                  {mutedState ? <Icons.VolumeX /> : <Icons.Volume2 />}
                </button>

                <button
                  onClick={() => {
                    sounds.playClick();
                    setShowRules(true);
                  }}
                  className="px-4 py-2.5 rounded-xl bg-black/40 border-2 border-[#2dd4bf]/30 hover:bg-[#2dd4bf]/10 active:scale-95 transition-all font-bold text-sm flex items-center gap-2 text-[#2dd4bf]"
                >
                  <Icons.HelpCircle />
                  <span className="hidden sm:inline">Règles</span>
                </button>

                <button
                  onClick={() => {
                    sounds.playClick();
                    startNewMatch(opponentIndex);
                  }}
                  className="px-4 py-2.5 rounded-xl bg-gradient-to-r from-teal-400 to-teal-600 hover:from-teal-300 hover:to-teal-500 text-slate-950 font-black text-sm active:translate-y-px transition-all shadow-lg border-2 border-slate-900 flex items-center gap-2"
                >
                  <Icons.RotateCcw />
                  <span>Rejouer</span>
                </button>
              </div>
            </header>

            <div className="w-full max-w-7xl mx-auto px-2 sm:px-4 lg:px-6 mt-3">
              <div className="immersive-panel rounded-2xl p-3 sm:p-4 bg-gradient-to-r from-teal-950/70 via-[#0a2e2c]/90 to-teal-950/70 border border-[#2dd4bf]/20 shadow-md flex flex-col md:flex-row justify-between items-center gap-3">
                <div className="flex items-center gap-3">
                  <span className="text-3xl sm:text-4xl filter drop-shadow">{currentOpponent.flag}</span>
                  <div>
                    <div className="flex items-center gap-1.5">
                      <span className="text-[9px] font-black text-teal-300 tracking-wider uppercase bg-teal-950/60 px-2 py-0.5 rounded border border-teal-400/20 leading-none">FACE À :</span>
                      <span className="text-[11px] text-teal-200/60 font-medium italic">{currentOpponent.desc}</span>
                    </div>
                    <h2 className="text-base sm:text-lg font-black text-slate-100 flex items-center gap-2 leading-tight mt-1">

                        <li>À votre tour, vous devez poser un domino dont l'une des moitiés a le même chiffre qu'une extrémité libre sur la table.</li>
                        <li>Les doubles se positionnent verticalement pour le plaisir des yeux !</li>
                        <li>Si vous n'avez aucun domino compatible, vous devez <strong>piocher (Talon)</strong> jusqu'à en tirer un jouable. Si la pioche est vide, vous devez obligatoirement <strong>Passer</strong>.</li>
                      </ul>
                    </div>

                    <div>
                      <h4 className="font-bold text-[#2dd4bf] flex items-center gap-1.5"><Icons.Check />Fin de Partie (Conditions d'arrêt)</h4>
                      <ul className="list-disc pl-5 mt-1 space-y-1 text-slate-300">
                        <li><strong>Dominos épuisés :</strong> Un joueur place son dernier domino et remporte immédiatement la manche !</li>
                        <li><strong>Jeu Bloqué :</strong> Plus aucun joueur ne dispose de coup valide et le talon est vide. Dans cette situation, le joueur avec le <strong>moins de points</strong> restants gagne la partie et marque la somme de tous les points de l'adversaire.</li>
                      </ul>
                    </div>
                  </div>

                  <div className="mt-6 pt-3 border-t border-[#2dd4bf]/20 flex justify-end">
                    <button
                      onClick={() => {
                        sounds.playClick();
                        setShowRules(false);
                      }}
                      className="px-5 py-2.5 bg-teal-400 text-slate-950 font-black rounded-xl text-xs uppercase cursor-pointer"
                    >
                      J'ai compris !
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Round completion Modal */}
            {showRoundPopup && (
              <div className="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
                <div className="bg-[#0f3d3a] border-2 border-[#2dd4bf] rounded-3xl max-w-md w-full p-6 text-center shadow-2xl relative overflow-hidden">
                  <div className="text-xs font-black text-teal-450 tracking-wider uppercase mb-2">
                    FIN DE MANCHE — ROUND {roundNumber} / 12
                  </div>

                  {roundWinner === 'player' ? (
                    <div className="flex flex-col items-center">
                      <div className="w-14 h-14 rounded-full bg-teal-500/20 border-2 border-teal-400/60 flex items-center justify-center mb-3">
                        <Icons.Trophy />
                      </div>
                      <h3 className="text-xl font-black text-[#2dd4bf] leading-tight">
                        Manche pour vous !
                      </h3>
                      <p className="text-xs text-teal-100/70 mt-2 leading-relaxed">
                        Vous remportez ce round et récupérez les points des dominos restants dans la main de {currentOpponent.name}.
                      </p>
                      <div className="mt-4 px-4 py-2 rounded-xl bg-teal-950/60 border border-[#2dd4bf]/20 text-sm font-mono font-black text-[#2dd4bf]">
                        Score du round : +{roundGainedPoints} points !
                      </div>
                    </div>
                  ) : roundWinner === 'computer' ? (
                    <div className="flex flex-col items-center">
                      <div className="w-14 h-14 rounded-full bg-rose-500/20 border-2 border-rose-400/50 flex items-center justify-center mb-3">
                        <span className="text-2xl">{currentOpponent.flag}</span>
                      </div>
                      <h3 className="text-xl font-black text-rose-400 leading-tight">
                        Manche pour {currentOpponent.name}
                      </h3>
                      <p className="text-xs text-rose-100/70 mt-2 leading-relaxed">
                        Votre adversaire remporte ce round et récupère les points de vos dominos restants.
                      </p>
                      <div className="mt-4 px-4 py-2 rounded-xl bg-rose-955/40 border border-rose-500/20 text-sm font-mono font-black text-rose-400">
                        Score du round : +{roundGainedPoints} points !
                      </div>
                    </div>
                  ) : (
                    <div className="flex flex-col items-center">
                      <div className="w-14 h-14 rounded-full bg-slate-500/20 border-2 border-slate-400/50 flex items-center justify-center mb-3">
                        <span className="text-2xl">🤝</span>
                      </div>
                      <h3 className="text-xl font-black text-slate-200 leading-tight">
                        Bloqué : Égalité !
                      </h3>
                      <p className="text-xs text-slate-100/70 mt-2 leading-relaxed">
                        Les deux jeux ont été bloqués avec exactement la même valeur de points restants. Aucun point n'est marqué.
                      </p>
                    </div>
                  )}

                  <div className="mt-5 p-3 rounded-xl bg-black/40 border border-white/5 grid grid-cols-2 gap-2 text-center text-xs">
                    <div className="border-r border-white/5">
                      <span className="text-[10px] text-teal-300/60 block uppercase">Vos points restants</span>
                      <span className="font-mono text-base font-black text-teal-100">
                        {calculateHandScore(playerHand)} pts
                      </span>
                    </div>
                    <div>
                      <span className="text-[10px] text-teal-300/60 block uppercase">Points restants IA</span>
                      <span className="font-mono text-base font-black text-teal-100">
                        {calculateHandScore(computerHand)} pts
                      </span>
                    </div>
                  </div>

                  <div className="mt-5 pt-4 border-t border-white/10">
                    <p className="text-[10px] font-black text-teal-200/50 uppercase tracking-widest text-center mb-2.5">
                      TABLEAU DES SCORES CUMULÉS
                    </p>
                    <div className="flex justify-between items-center bg-black/30 p-2.5 rounded-xl border border-[#2dd4bf]/10">
                      <div className="text-left">
                        <span className="text-[9px] text-[#2dd4bf]/70 font-bold block uppercase leading-none">VOUS</span>
                        <span className="text-base font-mono font-black text-[#2dd4bf]">{tournamentPlayerScore} <span className="text-[10px] font-normal">/100</span></span>
                      </div>
                      <div className="text-center text-[10px] font-bold text-slate-400 px-2 bg-white/5 rounded-md self-center">VS</div>
                      <div className="text-right">
                        <span className="text-[9px] text-rose-300 block uppercase leading-none">{currentOpponent.name}</span>
                        <span className="text-base font-mono font-black text-rose-455">{tournamentComputerScore} <span className="text-[10px] font-normal">/100</span></span>
                      </div>
                    </div>
                  </div>

                  <button
                    onClick={handleRoundContinue}
                    className="mt-6 w-full py-3 bg-teal-400 hover:bg-teal-300 text-slate-950 font-black rounded-2xl text-xs uppercase shadow-xl flex items-center justify-center gap-2 cursor-pointer"
                  >
                    <span>Continuer la partie</span>
                    <Icons.ArrowRight />
                  </button>
                </div>
              </div>
            )}

            {/* General Tournament End Victory / Defeat Modal */}
            {showTournamentEndPopup && (
              <div className="fixed inset-0 bg-black/95 backdrop-blur-md flex items-center justify-center p-4 z-50">
                <div className="bg-[#0b2b29] border-4 border-dashed border-[#2dd4bf] rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl relative overflow-hidden animate-scale-up">
                  {tournamentWinner === 'player' ? (
                    <div className="flex flex-col items-center">
                      <div className="w-20 h-20 rounded-2xl bg-gradient-to-tr from-yellow-405 to-teal-500 border-2 border-yellow-400/80 flex items-center justify-center mb-5 rotate-6 shadow-lg">
                        <Icons.Trophy />
                      </div>
                      <div className="text-[10px] bg-teal-950 text-teal-300 border border-[#2dd4bf]/30 font-black px-3 py-1 rounded-full uppercase tracking-widest text-center">
                        🏆 CHAMPIONNAT REMPORTÉ !
                      </div>
                      <h2 className="text-2xl font-black text-[#2dd4bf] mt-3 leading-none uppercase">
                        BRAVO CHAMPION !
                      </h2>
                      <div className="text-[11px] font-bold text-teal-100 mt-1 uppercase tracking-wider bg-black/30 border border-[#2dd4bf]/20 px-3 py-0.5 rounded-full">
                        <span>Vous avez terrassé {currentOpponent.name}</span>
                      </div>
                      <p className="text-xs text-teal-100/70 mt-4 leading-relaxed">
                        Grâce à votre sagacité, vous avez atteint la barre ultime des 100 points avant votre rival de l'arène de {currentOpponent.country}. En route pour de nouveaux défis géographiques !
                      </p>

                      <div className="mt-5 w-full bg-black/45 p-3 rounded-xl border border-white/5 flex justify-around text-center">
                        <div>
                          <span className="text-[9px] text-[#2dd4bf]/70 block font-bold">Votre score final</span>
                          <span className="font-mono text-xl font-black text-[#2dd4bf]">{tournamentPlayerScore} pts</span>
                        </div>
                        <div className="w-[1px] h-8 bg-white/10" />
                        <div>
                          <span className="text-[9px] text-rose-350 block font-bold">{currentOpponent.name}</span>
                          <span className="font-mono text-xl font-black text-rose-400">{tournamentComputerScore} pts</span>
                        </div>
                      </div>

                      <div className="mt-6 w-full flex flex-col gap-2">
                        {opponentIndex < OPPONENTS.length - 1 ? (
                          <button
                            onClick={handleNextOpponent}
                            className="w-full py-3.5 bg-teal-400 hover:bg-teal-300 text-slate-950 font-black rounded-2xl text-xs uppercase flex items-center justify-center gap-2 cursor-pointer shadow-lg active:scale-95 transition-all"
                          >
                            <span>Affronter le pays suivant ({OPPONENTS[opponentIndex + 1].flag})</span>
                            <Icons.ArrowRight />
                          </button>
                        ) : (
                          <button
                            onClick={() => startNewMatch(0)}
                            className="w-full py-3.5 bg-teal-300 hover:bg-teal-200 text-slate-950 font-black rounded-2xl text-xs uppercase flex items-center justify-center gap-2 cursor-pointer shadow-lg active:scale-95 transition-all"
                          >
                            <Icons.RotateCcw />
                            <span>Recommencer le Grand Tournoi !</span>
                          </button>
                        )}
                      </div>
                    </div>
                  ) : (
                    <div className="flex flex-col items-center">
                      <div className="w-20 h-20 rounded-2xl bg-black/50 border-2 border-rose-500/40 flex items-center justify-center mb-5 shadow-inner">
                        <span className="text-4xl filter grayscale">💀</span>
                      </div>
                      <div className="text-[10px] bg-rose-950 text-rose-400 border border-rose-500/30 font-black px-3 py-1 rounded-full uppercase tracking-widest text-center">
                        😭 TOURNOI CLÔTURÉ
                      </div>
                      <h2 className="text-2xl font-black text-rose-400 mt-3 leading-none uppercase">
                        DÉFAITE CUISANTE
                      </h2>
                      <p className="text-xs text-rose-100/70 mt-4 leading-relaxed">
                        {currentOpponent.name} a atteint les 100 points ou possède une avance critique après 12 rounds d'affrontements intensifs. Relevez la tête pour retenter cette arène !
                      </p>

                      <div className="mt-5 w-full bg-black/45 p-3 rounded-xl border border-white/5 flex justify-around text-center">
                        <div>
                          <span className="text-[9px] text-[#2dd4bf]/70 block font-bold">Votre score final</span>
                          <span className="font-mono text-xl font-black text-[#2dd4bf]">{tournamentPlayerScore} pts</span>
                        </div>
                        <div className="w-[1px] h-8 bg-white/10" />
                        <div>
                          <span className="text-[9px] text-rose-350 block font-bold">{currentOpponent.name}</span>
                          <span className="font-mono text-xl font-black text-rose-400">{tournamentComputerScore} pts</span>
                        </div>
                      </div>

                      <div className="mt-6 w-full">
                        <button
                          onClick={handleRetryOpponent}
                          className="w-full py-3.5 bg-rose-600 hover:bg-rose-500 text-white font-black rounded-2xl text-xs uppercase flex items-center justify-center gap-2 cursor-pointer shadow-lg"
                        >
                          <Icons.RotateCcw />
                          <span>Prendre ma revanche ({currentOpponent.flag})</span>
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
